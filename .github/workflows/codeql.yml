name: CodeQL security analysis

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            os: macos-26
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the supported Swift toolchain
        if: matrix.language == 'swift'
        shell: bash
        run: |
          test -d /Applications/Xcode_26.6.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer' >> "$GITHUB_ENV"
          echo 'WHOOSH_ZOOM_SDK_PATH=/tmp/zooom-codeql-without-proprietary-sdk' >> "$GITHUB_ENV"
      - name: Resolve locked Swift dependencies
        if: matrix.language == 'swift'
        run: swift package resolve --force-resolved-versions
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # CodeQL 2.26.2+ supports this project's Swift 6.3.3 toolchain.
          tools: latest
          queries: security-extended
      - name: Build first-party Swift without the proprietary Zoom SDK
        if: matrix.language == 'swift'
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          swift build --disable-sandbox --arch arm64 --product Whoosh --scratch-path "$RUNNER_TEMP/codeql-swift-build" --force-resolved-versions
      - name: Analyze and upload findings
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
