name: Project website
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'PRIVACY.md'
      - 'TERMS.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'Documentation/**'
      - 'Resources/YapIcon.png'
      - 'Resources/GoogleSiteVerification.txt'
      - 'Services/zoom-auth/site/**'
      - 'Scripts/build-review-site.py'
      - 'Scripts/build-github-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build allowlisted static pages
        run: python3 Scripts/build-github-pages.py --output "$RUNNER_TEMP/yap-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/yap-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
